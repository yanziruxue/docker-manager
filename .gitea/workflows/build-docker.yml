name: build-docker-image

# ============================================================
# Docker 镜像构建工作流（Gitea Actions）
#
# 触发规则（2026-11-13 修正：手动 dispatch 恢复 target 选择）：
#   - 打 tag (v*) 推送            → 自动构建并推送 Gitea 内置容器镜像库
#                                   192.168.24.10:8024/yanzi/dockermanagementyanzi  (:版本 + :latest)
#   - 手动触发 workflow_dispatch  → target 可选 gitea（默认）/ ghcr；
#                                   可用 version 输入手动指定镜像版本号，留空 = 取 package.json
#
# 前置硬条件：Gitea Actions runner 必须已安装 Docker 守护进程
#   （docker build 需要；若 runner 无 docker，须改用 docker:dind 服务容器 privileged）。
#
# 所需仓库秘密（Gitea 后台 Settings → Actions → Secrets）：
#   - DOCKER_USER / DOCKER_TOKEN （推 Gitea 镜像库；token 须含 包写(packages:write) 权限。
#                                  注：GITEA_/GITHUB_ 前缀为 Actions 自动注入 token 的保留名，
#                                  自建 Secret 禁用该前缀，故用 DOCKER_ 前缀）
#   - GHCR_PAT                  （推 ghcr.io 的登录凭证：GitHub **classic** PAT，
#                                  勾选 write:packages + read:packages；
#                                  生成入口 GitHub → Settings → Developer settings →
#                                  Personal access tokens (classic) → Generate new token）
#   - GHCR_USER                 （可选：ghcr 登录用户名，默认 yanzirue）
# ============================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: "推送目标镜像库（仅手动触发时生效）"
        required: true
        type: choice
        options:
          - gitea
          - ghcr
        default: gitea
      version:
        description: "镜像版本号（如 v1.52.1；留空 = 取 package.json 版本）"
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash

env:
  NODE_OPTIONS: ""          # 清空，避免 SafeDelete 垫片干扰（镜像内构建不走本机 shim，保留以与 build.yml 一致）

jobs:
  docker:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4
        # ── 内网若不通 gitea.com，改用同实例 actions 或下方手动 clone（仓库匿名可读）──
        # run: |
        #   git clone --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" _src
        #   shopt -s dotglob && mv _src/* . && rm -rf _src

      - name: Docker 环境自检（runner 须已安装 Docker 守护进程）
        run: |
          docker version || { echo "❌ 未检测到 Docker 守护进程，请使用装有 docker 的 runner（或改用 docker:dind 服务容器）"; exit 1; }

      - name: 计算版本与镜像名
        id: meta
        run: |
          # tag 事件用 tag 名（如 v1.51.18）；手动触发优先用 version 输入，留空回落 package.json 版本
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "gitea_image=192.168.24.10:8024/yanzi/dockermanagementyanzi" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=ghcr.io/yanzirue/dockermanagementyanzi" >> "$GITHUB_OUTPUT"
          echo "✅ VERSION=${VERSION}"

      - name: 构建镜像（多阶段：vite → SEA 单文件二进制 → debian 运行镜像）
        run: |
          docker build \
            -f deploy/docker/Dockerfile \
            -t "${{ steps.meta.outputs.gitea_image }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.gitea_image }}:latest" \
            -t "${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.ghcr_image }}:latest" \
            --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
            --build-arg APT_MIRROR=mirrors.aliyun.com \
            .

      - name: 推送 Gitea 容器镜像库（tag 自动触发，或手动选 target=gitea）
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'gitea') }}
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          echo "${DOCKER_TOKEN}" | docker login 192.168.24.10:8024 -u "${DOCKER_USER}" --password-stdin
          docker push "${{ steps.meta.outputs.gitea_image }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.gitea_image }}:latest"

      - name: 推送 ghcr.io（仅手动选 target=ghcr）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'ghcr' }}
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          # ghcr 为可选目标：未配置 GHCR_PAT 时清晰跳过，不让可选目标把整个 run 弄红
          if [ -z "${GHCR_PAT}" ]; then
            echo "⚠️ GHCR_PAT 未配置，跳过 ghcr 推送（如需推 ghcr，请在仓库 Settings → Actions → Secrets 配置 GHCR_PAT(GitHub classic PAT, write:packages) 与可选 GHCR_USER）"
            exit 0
          fi
          echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USER:-yanzirue}" --password-stdin
          docker push "${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.ghcr_image }}:latest"
