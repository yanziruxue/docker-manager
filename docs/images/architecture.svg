<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D7FD6"/>
      <stop offset="1" stop-color="#1668B8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" fill="#0F172A" font-size="26" font-weight="700">技术架构 · 前后端一体的单文件二进制</text>

  <!-- 浏览器层 -->
  <g>
    <rect x="420" y="70" width="360" height="64" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="420" y="70" width="360" height="64" rx="10" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="600" y="97" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="700">浏览器</text>
    <text x="600" y="120" text-anchor="middle" fill="#475569" font-size="14">React SPA · 中文界面 · 明暗主题</text>
  </g>

  <!-- 三通道箭头 -->
  <g stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
    <line x1="520" y1="134" x2="520" y2="186"/>
    <line x1="600" y1="134" x2="600" y2="186"/>
    <line x1="680" y1="134" x2="680" y2="186"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="520" y="166" fill="#2563EB">REST</text>
    <text x="600" y="166" fill="#0D9488">WebSocket</text>
    <text x="680" y="166" fill="#D97706">SSE</text>
  </g>
  <text x="740" y="166" fill="#94A3B8" font-size="13">（常规请求 / 实时事件 / 资源监控流，断线自动重连）</text>

  <!-- 二进制主体 -->
  <g>
    <rect x="100" y="192" width="1000" height="212" rx="12" fill="#F0F7FF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="100" y="192" width="1000" height="46" rx="12" fill="url(#hdr)"/>
    <rect x="100" y="222" width="1000" height="16" fill="url(#hdr)"/>
    <text x="600" y="222" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">dockermanagementyanzi — Node 22 SEA 单可执行文件（无外部依赖，下载即运行）</text>

    <!-- 服务模块 chips -->
    <g font-size="14" font-weight="600" text-anchor="middle">
      <g><rect x="140" y="262" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="206" y="287" fill="#1D4ED8">引擎管理</text></g>
      <g><rect x="288" y="262" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="354" y="287" fill="#1D4ED8">用户认证</text></g>
      <g><rect x="436" y="262" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="502" y="287" fill="#1D4ED8">通知中心</text></g>
      <g><rect x="584" y="262" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="650" y="287" fill="#1D4ED8">备份计划</text></g>
      <g><rect x="732" y="262" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="798" y="287" fill="#1D4ED8">镜像加速</text></g>
      <g><rect x="880" y="262" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="946" y="287" fill="#1D4ED8">OTA 升级</text></g>
      <g><rect x="140" y="318" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="206" y="343" fill="#1D4ED8">自定义图标</text></g>
      <g><rect x="288" y="318" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="354" y="343" fill="#1D4ED8">日志 demux</text></g>
      <g><rect x="436" y="318" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="502" y="343" fill="#1D4ED8">温度监控</text></g>
      <g><rect x="584" y="318" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="650" y="343" fill="#1D4ED8">密钥保管</text></g>
      <g><rect x="732" y="318" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="798" y="343" fill="#1D4ED8">计划任务</text></g>
      <g><rect x="880" y="318" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="946" y="343" fill="#1D4ED8">Web 终端</text></g>
    </g>
    <text x="600" y="388" text-anchor="middle" fill="#64748B" font-size="14">systemd 服务托管 · 默认监听 :5024 · 前端静态资源 base64 内嵌</text>
  </g>

  <!-- 到引擎的箭头 -->
  <g stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
    <line x1="240" y1="404" x2="240" y2="452"/>
    <line x1="480" y1="404" x2="480" y2="452"/>
    <line x1="720" y1="404" x2="720" y2="452"/>
    <line x1="960" y1="404" x2="960" y2="452"/>
  </g>

  <!-- 引擎三态 + 数据目录 -->
  <g text-anchor="middle">
    <!-- 本地 Socket -->
    <g>
      <rect x="110" y="458" width="260" height="150" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
      <rect x="110" y="458" width="260" height="42" rx="12" fill="#16A34A"/>
      <rect x="110" y="484" width="260" height="16" fill="#16A34A"/>
      <text x="240" y="485" fill="#FFFFFF" font-size="17" font-weight="700">本地 Socket</text>
      <text x="240" y="528" fill="#374151" font-size="14">/var/run/docker.sock 直连</text>
      <text x="240" y="552" fill="#374151" font-size="14">与 Docker 同机部署，最快最稳</text>
      <text x="240" y="584" fill="#15803D" font-size="13" font-weight="600">推荐 · 默认方式</text>
    </g>
    <!-- 远程 TCP -->
    <g>
      <rect x="370" y="458" width="260" height="150" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
      <rect x="370" y="458" width="260" height="42" rx="12" fill="#2563EB"/>
      <rect x="370" y="484" width="260" height="16" fill="#2563EB"/>
      <text x="500" y="485" fill="#FFFFFF" font-size="17" font-weight="700">远程 TCP</text>
      <text x="500" y="528" fill="#374151" font-size="14">tcp:// 连接远端 daemon</text>
      <text x="500" y="552" fill="#374151" font-size="14">支持 TLS 自签证书</text>
      <text x="500" y="584" fill="#1D4ED8" font-size="13" font-weight="600">需远端开启 2375 / 2376</text>
    </g>
    <!-- 远程 SSH -->
    <g>
      <rect x="630" y="458" width="260" height="150" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
      <rect x="630" y="458" width="260" height="42" rx="12" fill="#EA580C"/>
      <rect x="630" y="484" width="260" height="16" fill="#EA580C"/>
      <text x="760" y="485" fill="#FFFFFF" font-size="17" font-weight="700">远程 SSH</text>
      <text x="760" y="528" fill="#374151" font-size="14">免装 agent，SSH 登录后</text>
      <text x="760" y="552" fill="#374151" font-size="14">在服务器本地执行 docker CLI</text>
      <text x="760" y="584" fill="#C2410C" font-size="13" font-weight="600">适合仅有 SSH 权限的 NAS / 云主机</text>
    </g>
    <!-- 数据目录 -->
    <g>
      <rect x="890" y="458" width="220" height="150" rx="12" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="2"/>
      <rect x="890" y="458" width="220" height="42" rx="12" fill="#7C3AED"/>
      <rect x="890" y="484" width="220" height="16" fill="#7C3AED"/>
      <text x="1000" y="485" fill="#FFFFFF" font-size="17" font-weight="700">本地数据</text>
      <text x="1000" y="528" fill="#374151" font-size="14" font-family="Consolas,monospace">data/  config/  logs/</text>
      <text x="1000" y="552" fill="#374151" font-size="14">备份 / 迁移只需拷贝安装目录</text>
      <text x="1000" y="584" fill="#6D28D9" font-size="13" font-weight="600">全部位于安装目录内</text>
    </g>
  </g>

  <text x="600" y="656" text-anchor="middle" fill="#94A3B8" font-size="14">以非 root 专用账户运行（加入 docker 组）· OTA 升级仅替换二进制，data/ 与 config/ 不受影响</text>
</svg>
