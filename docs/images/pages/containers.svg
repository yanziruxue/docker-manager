<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="760" fill="#0B1220"/>
  <rect width="200" height="760" fill="#0E1830"/>
  <rect x="24" y="22" width="26" height="26" rx="7" fill="#2563EB"/>
  <text x="60" y="40" fill="#E2E8F0" font-size="15" font-weight="600">Docker 管理</text>
  <g font-size="13">
    <text x="34" y="88" fill="#7C8DB0">◧ 仪表盘</text>
    <rect x="12" y="106" width="176" height="34" rx="8" fill="#1D4ED8"/>
    <text x="34" y="128" fill="#fff">▤ 容器管理</text>
    <text x="34" y="170" fill="#7C8DB0">⚗ 堆栈管理</text>
    <text x="34" y="210" fill="#7C8DB0">▣ 镜像管理</text>
    <text x="34" y="250" fill="#7C8DB0">▤ 数据卷管理</text>
    <text x="34" y="290" fill="#7C8DB0">◈ 网络管理</text>
    <text x="34" y="330" fill="#7C8DB0">◉ 通知中心</text>
    <text x="34" y="370" fill="#7C8DB0">⚙ 设置中心</text>
  </g>
  <text x="232" y="46" fill="#E2E8F0" font-size="19" font-weight="700">容器管理 <tspan fill="#64748B" font-size="13">20 个</tspan></text>
  <line x1="200" y1="64" x2="1200" y2="64" stroke="#1E2A4A"/>
  <!-- 工具栏 -->
  <rect x="228" y="86" width="380" height="34" rx="9" fill="#111C33" stroke="#1E2A4A"/>
  <circle cx="248" cy="103" r="7" fill="none" stroke="#64748B" stroke-width="2"/>
  <line x1="253" y1="108" x2="259" y2="114" stroke="#64748B" stroke-width="2"/>
  <text x="268" y="108" fill="#64748B" font-size="12">搜索容器名、镜像、标签…</text>
  <g font-size="12" text-anchor="middle">
    <rect x="622" y="86" width="56" height="34" rx="9" fill="#1D4ED8"/><text x="650" y="108" fill="#fff">全部</text>
    <rect x="686" y="86" width="72" height="34" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="722" y="108" fill="#94A3B8">运行中</text>
    <rect x="766" y="86" width="72" height="34" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="802" y="108" fill="#94A3B8">已停止</text>
    <rect x="1010" y="86" width="70" height="34" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="1045" y="108" fill="#94A3B8">列 ▾</text>
    <rect x="1088" y="86" width="84" height="34" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="1130" y="108" fill="#94A3B8">导出 ⤓</text>
  </g>
  <!-- 表头 -->
  <g font-size="12" fill="#64748B">
    <text x="244" y="152">图标</text><text x="300" y="152">容器名</text><text x="470" y="152">状态</text><text x="590" y="152">标签</text><text x="810" y="152">所属堆栈</text><text x="940" y="152">网络</text><text x="1030" y="152">运行时长</text><text x="1136" y="152">WebUI</text>
  </g>
  <line x1="228" y1="164" x2="1172" y2="164" stroke="#1E2A4A"/>
  <!-- 行 -->
  <g font-size="12">
    <g>
      <circle cx="260" cy="192" r="12" fill="#0D9488"/><text x="300" y="196" fill="#E2E8F0">jellyfin</text>
      <circle cx="476" cy="192" r="4" fill="#22C55E"/><text x="470" y="196" fill="#22C55E">运行中</text>
      <rect x="588" y="180" width="52" height="20" rx="10" fill="#1E3A5F"/><text x="614" y="194" fill="#7DD3FC" font-size="10" text-anchor="middle">影音</text>
      <rect x="646" y="180" width="52" height="20" rx="10" fill="#3B1E5F"/><text x="672" y="194" fill="#D8B4FE" font-size="10" text-anchor="middle">数据库</text>
      <text x="810" y="196" fill="#94A3B8">media</text><text x="940" y="196" fill="#94A3B8">bridge</text><text x="1030" y="196" fill="#94A3B8">6 天 4 小时</text>
      <circle cx="1142" cy="191" r="8" fill="#1D4ED8"/><text x="1142" y="195" fill="#fff" font-size="9" text-anchor="middle">↗</text>
    </g>
    <line x1="228" y1="216" x2="1172" y2="216" stroke="#16203B"/>
    <g>
      <circle cx="260" cy="244" r="12" fill="#D97706"/><text x="300" y="248" fill="#E2E8F0">qbittorrent</text>
      <circle cx="476" cy="244" r="4" fill="#22C55E"/><text x="470" y="248" fill="#22C55E">运行中</text>
      <rect x="588" y="232" width="52" height="20" rx="10" fill="#5F3A1E"/><text x="614" y="246" fill="#FDBA74" font-size="10" text-anchor="middle">下载</text>
      <text x="810" y="248" fill="#94A3B8">download</text><text x="940" y="248" fill="#94A3B8">bridge</text><text x="1030" y="248" fill="#94A3B8">12 天 1 小时</text>
      <circle cx="1142" cy="243" r="8" fill="#1D4ED8"/><text x="1142" y="247" fill="#fff" font-size="9" text-anchor="middle">↗</text>
    </g>
    <line x1="228" y1="268" x2="1172" y2="268" stroke="#16203B"/>
    <g>
      <circle cx="260" cy="296" r="12" fill="#16A34A"/><text x="300" y="300" fill="#E2E8F0">postgres</text>
      <circle cx="476" cy="296" r="4" fill="#22C55E"/><text x="470" y="300" fill="#22C55E">运行 · healthy</text>
      <rect x="588" y="284" width="52" height="20" rx="10" fill="#3B1E5F"/><text x="614" y="298" fill="#D8B4FE" font-size="10" text-anchor="middle">数据库</text>
      <text x="810" y="300" fill="#94A3B8">blog</text><text x="940" y="300" fill="#94A3B8">bridge</text><text x="1030" y="300" fill="#94A3B8">30 天 8 小时</text>
      <circle cx="1142" cy="295" r="8" fill="#1D4ED8"/><text x="1142" y="299" fill="#fff" font-size="9" text-anchor="middle">↗</text>
    </g>
    <line x1="228" y1="320" x2="1172" y2="320" stroke="#16203B"/>
    <g>
      <circle cx="260" cy="348" r="12" fill="#DB2777"/><text x="300" y="352" fill="#E2E8F0">gitea</text>
      <circle cx="476" cy="348" r="4" fill="#22C55E"/><text x="470" y="352" fill="#22C55E">运行 · healthy</text>
      <rect x="588" y="336" width="52" height="20" rx="10" fill="#1E3A5F"/><text x="614" y="350" fill="#7DD3FC" font-size="10" text-anchor="middle">开发</text>
      <text x="810" y="352" fill="#94A3B8">devops</text><text x="940" y="352" fill="#94A3B8">bridge</text><text x="1030" y="352" fill="#94A3B8">45 天 2 小时</text>
      <circle cx="1142" cy="347" r="8" fill="#1D4ED8"/><text x="1142" y="351" fill="#fff" font-size="9" text-anchor="middle">↗</text>
    </g>
    <line x1="228" y1="372" x2="1172" y2="372" stroke="#16203B"/>
    <g opacity="0.55">
      <circle cx="260" cy="400" r="12" fill="#64748B"/><text x="300" y="404" fill="#CBD5E1">memcached</text>
      <circle cx="476" cy="400" r="4" fill="#64748B"/><text x="470" y="404" fill="#94A3B8">已停止</text>
      <text x="810" y="404" fill="#94A3B8">cache</text><text x="940" y="404" fill="#94A3B8">bridge</text><text x="1030" y="404" fill="#94A3B8">—</text>
    </g>
  </g>
  <!-- 详情页预览 -->
  <g>
    <rect x="228" y="440" width="944" height="288" rx="12" fill="#0E1830" stroke="#1E2A4A"/>
    <text x="252" y="470" fill="#94A3B8" font-size="12">▼ 点击容器行 → 容器详情页</text>
    <rect x="252" y="486" width="440" height="222" rx="10" fill="#111C33" stroke="#1E2A4A"/>
    <text x="272" y="514" fill="#E2E8F0" font-size="13" font-weight="600">基本信息（单列，可拖宽）</text>
    <g font-size="11">
      <text x="272" y="540" fill="#64748B">状态</text><text x="380" y="540" fill="#22C55E">● 运行中 · healthy</text>
      <text x="272" y="564" fill="#64748B">运行时长</text><text x="380" y="564" fill="#CBD5E1">6 天 4 小时</text>
      <text x="272" y="588" fill="#64748B">端口</text><text x="380" y="588" fill="#CBD5E1">8096 → 8096/tcp</text>
      <text x="272" y="612" fill="#64748B">标签</text><text x="380" y="612" fill="#7DD3FC">影音</text>
      <text x="272" y="636" fill="#64748B">所属堆栈</text><text x="380" y="636" fill="#CBD5E1">media</text>
      <text x="272" y="660" fill="#64748B">重启策略</text><text x="380" y="660" fill="#CBD5E1">unless-stopped</text>
    </g>
    <g>
      <rect x="712" y="486" width="212" height="104" rx="10" fill="#111C33" stroke="#1E2A4A"/>
      <text x="730" y="510" fill="#94A3B8" font-size="11">CPU</text><text x="906" y="510" fill="#3B82F6" font-size="13" font-weight="700" text-anchor="end">4.2%</text>
      <polyline points="730,560 754,552 778,558 802,544 826,552 850,538 874,548 898,530" fill="none" stroke="#3B82F6" stroke-width="2"/>
      <rect x="940" y="486" width="212" height="104" rx="10" fill="#111C33" stroke="#1E2A4A"/>
      <text x="958" y="510" fill="#94A3B8" font-size="11">内存</text><text x="1134" y="510" fill="#8B5CF6" font-size="13" font-weight="700" text-anchor="end">812 MB</text>
      <polyline points="958,560 982,554 1006,558 1030,546 1054,552 1078,540 1102,548 1126,534" fill="none" stroke="#8B5CF6" stroke-width="2"/>
      <rect x="712" y="604" width="212" height="104" rx="10" fill="#111C33" stroke="#1E2A4A"/>
      <text x="730" y="628" fill="#94A3B8" font-size="11">网络 I/O</text><text x="906" y="628" fill="#F59E0B" font-size="13" font-weight="700" text-anchor="end">1.8 MB/s</text>
      <polyline points="730,678 754,668 778,674 802,660 826,668 850,654 874,662 898,648" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <rect x="940" y="604" width="212" height="104" rx="10" fill="#111C33" stroke="#1E2A4A"/>
      <text x="958" y="628" fill="#94A3B8" font-size="11">磁盘 I/O</text><text x="1134" y="628" fill="#22C55E" font-size="13" font-weight="700" text-anchor="end">6.4 MB/s</text>
      <polyline points="958,678 982,670 1006,676 1030,662 1054,670 1078,658 1102,666 1126,652" fill="none" stroke="#22C55E" stroke-width="2"/>
    </g>
    <text x="252" y="722" fill="#475569" font-size="11">同页还有：只读 xterm 日志终端（ANSI 彩色 · 无乱码）、交互式 Web 终端、启停/重启/删除操作</text>
  </g>
</svg>
