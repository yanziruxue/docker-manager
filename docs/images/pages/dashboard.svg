<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="760" fill="#0B1220"/>
  <!-- 侧边栏 -->
  <rect width="200" height="760" fill="#0E1830"/>
  <rect x="24" y="22" width="26" height="26" rx="7" fill="#2563EB"/>
  <text x="60" y="40" fill="#E2E8F0" font-size="15" font-weight="600">Docker 管理</text>
  <g font-size="13">
    <rect x="12" y="66" width="176" height="34" rx="8" fill="#1D4ED8"/>
    <text x="34" y="88" fill="#fff">◧ 仪表盘</text>
    <text x="34" y="130" fill="#7C8DB0">▤ 容器管理</text>
    <text x="34" y="170" fill="#7C8DB0">⚗ 堆栈管理</text>
    <text x="34" y="210" fill="#7C8DB0">▣ 镜像管理</text>
    <text x="34" y="250" fill="#7C8DB0">▤ 数据卷管理</text>
    <text x="34" y="290" fill="#7C8DB0">◈ 网络管理</text>
    <text x="34" y="330" fill="#7C8DB0">◉ 通知中心</text>
    <text x="34" y="370" fill="#7C8DB0">⚙ 设置中心</text>
  </g>
  <!-- 顶栏 -->
  <text x="232" y="46" fill="#E2E8F0" font-size="19" font-weight="700">仪表盘</text>
  <rect x="1000" y="24" width="120" height="30" rx="15" fill="#111C33" stroke="#1E2A4A"/>
  <circle cx="1018" cy="39" r="6" fill="#22C55E"/>
  <text x="1032" y="44" fill="#CBD5E1" font-size="12">NAS-飞牛</text>
  <line x1="200" y1="64" x2="1200" y2="64" stroke="#1E2A4A"/>
  <!-- 处理器 -->
  <g>
    <rect x="228" y="88" width="462" height="180" rx="12" fill="#111C33" stroke="#1E2A4A"/>
    <text x="252" y="118" fill="#E2E8F0" font-size="14" font-weight="600">处理器</text>
    <text x="252" y="140" fill="#64748B" font-size="11">Intel Alder Lake-N100</text>
    <text x="640" y="118" fill="#3B82F6" font-size="20" font-weight="700" text-anchor="end">23%</text>
    <polyline points="252,220 292,200 332,214 372,186 412,208 452,178 492,196 532,170 572,190 612,164 652,182" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <g fill="#334155"><rect x="252" y="238" width="34" height="5" rx="2.5"/><rect x="294" y="238" width="34" height="5" rx="2.5"/><rect x="336" y="238" width="34" height="5" rx="2.5"/><rect x="378" y="238" width="34" height="5" rx="2.5"/><rect x="420" y="238" width="34" height="5" rx="2.5"/><rect x="462" y="238" width="34" height="5" rx="2.5"/><rect x="504" y="238" width="34" height="5" rx="2.5"/><rect x="546" y="238" width="34" height="5" rx="2.5"/><rect x="588" y="238" width="34" height="5" rx="2.5"/><rect x="630" y="238" width="34" height="5" rx="2.5"/></g>
    <g fill="#2563EB"><rect x="252" y="238" width="18" height="5" rx="2.5"/><rect x="294" y="238" width="8" height="5" rx="2.5"/><rect x="336" y="238" width="26" height="5" rx="2.5"/><rect x="378" y="238" width="12" height="5" rx="2.5"/><rect x="420" y="238" width="22" height="5" rx="2.5"/><rect x="462" y="238" width="6" height="5" rx="2.5"/><rect x="504" y="238" width="30" height="5" rx="2.5"/><rect x="546" y="238" width="10" height="5" rx="2.5"/><rect x="588" y="238" width="16" height="5" rx="2.5"/><rect x="630" y="238" width="24" height="5" rx="2.5"/></g>
  </g>
  <!-- 内存 + 显卡 -->
  <g>
    <rect x="710" y="88" width="222" height="180" rx="12" fill="#111C33" stroke="#1E2A4A"/>
    <text x="734" y="118" fill="#E2E8F0" font-size="14" font-weight="600">内存</text>
    <text x="908" y="118" fill="#8B5CF6" font-size="18" font-weight="700" text-anchor="end">5.6/31.1G</text>
    <polyline points="734,200 764,188 794,208 824,180 854,196 884,172 914,190" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="734" y="228" width="174" height="6" rx="3" fill="#1E2A4A"/>
    <rect x="734" y="228" width="70" height="6" rx="3" fill="#8B5CF6"/>
  </g>
  <g>
    <rect x="952" y="88" width="220" height="180" rx="12" fill="#111C33" stroke="#1E2A4A"/>
    <text x="976" y="118" fill="#E2E8F0" font-size="14" font-weight="600">显卡</text>
    <text x="1148" y="118" fill="#06B6D4" font-size="16" font-weight="700" text-anchor="end">12%</text>
    <polyline points="976,200 1006,206 1036,188 1066,198 1096,178 1126,192 1150,184" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <text x="976" y="242" fill="#64748B" font-size="11">Iris Xe 770 · 46°C</text>
  </g>
  <!-- 容器卡片墙 -->
  <g>
    <rect x="228" y="288" width="944" height="120" rx="12" fill="#111C33" stroke="#1E2A4A"/>
    <text x="252" y="318" fill="#E2E8F0" font-size="14" font-weight="600">容器 <tspan fill="#64748B" font-size="11">19 运行 · 1 停止</tspan></text>
    <g font-size="10" text-anchor="middle">
      <rect x="380" y="300" width="66" height="52" rx="9" fill="#0E1830" stroke="#1E2A4A"/><circle cx="413" cy="320" r="11" fill="#2563EB"/><text x="413" y="344" fill="#94A3B8">nginx</text>
      <rect x="458" y="300" width="66" height="52" rx="9" fill="#0E1830" stroke="#1E2A4A"/><circle cx="491" cy="320" r="11" fill="#7C3AED"/><text x="491" y="344" fill="#94A3B8">plex</text>
      <rect x="536" y="300" width="66" height="52" rx="9" fill="#0E1830" stroke="#1E2A4A"/><circle cx="569" cy="320" r="11" fill="#0D9488"/><text x="569" y="344" fill="#94A3B8">redis</text>
      <rect x="614" y="300" width="66" height="52" rx="9" fill="#0E1830" stroke="#1E2A4A"/><circle cx="647" cy="320" r="11" fill="#D97706"/><text x="647" y="344" fill="#94A3B8">qbitt</text>
      <rect x="692" y="300" width="66" height="52" rx="9" fill="#0E1830" stroke="#1E2A4A"/><circle cx="725" cy="320" r="11" fill="#DB2777"/><text x="725" y="344" fill="#94A3B8">gitea</text>
      <rect x="770" y="300" width="66" height="52" rx="9" fill="#0E1830" stroke="#1E2A4A"/><circle cx="803" cy="320" r="11" fill="#16A34A"/><text x="803" y="344" fill="#94A3B8">memos</text>
      <rect x="848" y="300" width="66" height="52" rx="9" fill="#0E1830" stroke="#1E2A4A"/><circle cx="881" cy="320" r="11" fill="#64748B" opacity="0.6"/><text x="881" y="344" fill="#94A3B8">stopped</text>
      <text x="1130" y="330" fill="#3B82F6" font-size="12">查看全部 →</text>
    </g>
  </g>
  <!-- 网络与磁盘 -->
  <g>
    <rect x="228" y="428" width="462" height="300" rx="12" fill="#111C33" stroke="#1E2A4A"/>
    <text x="252" y="458" fill="#E2E8F0" font-size="14" font-weight="600">网络 <tspan fill="#64748B" font-size="11">eth0 ▾</tspan></text>
    <text x="270" y="490" fill="#EF4444" font-size="11">▲ 上行 2.4 MB/s</text>
    <text x="400" y="490" fill="#F59E0B" font-size="11">▼ 下行 8.1 MB/s</text>
    <polyline points="252,560 292,540 332,556 372,522 412,546 452,510 492,536 532,498 572,526 612,480 652,510" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <polyline points="252,600 292,592 332,598 372,584 412,592 452,576 492,588 532,570 572,584 612,560 652,576" fill="none" stroke="#EF4444" stroke-width="2"/>
  </g>
  <g font-size="10">
    <rect x="710" y="428" width="222" height="140" rx="12" fill="#111C33" stroke="#1E2A4A"/>
    <text x="734" y="458" fill="#E2E8F0" font-size="14" font-weight="600">磁盘 nvme0n1</text>
    <text x="734" y="486" fill="#22C55E">读 12 MB/s</text><text x="850" y="486" fill="#3B82F6">写 36 MB/s</text>
    <polyline points="734,530 770,516 806,528 842,502 878,520 914,494" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <text x="734" y="556" fill="#64748B">利用率 18%</text>
    <rect x="710" y="588" width="222" height="140" rx="12" fill="#111C33" stroke="#1E2A4A"/>
    <text x="734" y="618" fill="#E2E8F0" font-size="14" font-weight="600">磁盘 sda</text>
    <text x="734" y="646" fill="#22C55E">读 3 MB/s</text><text x="850" y="646" fill="#3B82F6">写 9 MB/s</text>
    <polyline points="734,690 770,680 806,688 842,672 878,682 914,664" fill="none" stroke="#22C55E" stroke-width="2"/>
    <text x="734" y="716" fill="#64748B">利用率 6%</text>
    <rect x="952" y="428" width="220" height="300" rx="12" fill="#111C33" stroke="#1E2A4A"/>
    <text x="976" y="458" fill="#E2E8F0" font-size="14" font-weight="600">磁盘 sdb</text>
    <text x="976" y="486" fill="#22C55E">读 1 MB/s</text><text x="1070" y="486" fill="#3B82F6">写 4 MB/s</text>
    <polyline points="976,540 1010,530 1044,538 1078,520 1112,532 1146,514" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <text x="976" y="570" fill="#64748B">利用率 3%</text>
    <text x="976" y="700" fill="#475569" font-size="11">悬停任意磁贴显示十字线与数值提示</text>
  </g>
</svg>
