<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="760" fill="#0B1220"/>
  <rect width="200" height="760" fill="#0E1830"/>
  <rect x="24" y="22" width="26" height="26" rx="7" fill="#2563EB"/>
  <text x="60" y="40" fill="#E2E8F0" font-size="15" font-weight="600">Docker 管理</text>
  <g font-size="13">
    <text x="34" y="88" fill="#7C8DB0">◧ 仪表盘</text><text x="34" y="130" fill="#7C8DB0">▤ 容器管理</text><text x="34" y="170" fill="#7C8DB0">⚗ 堆栈管理</text><text x="34" y="210" fill="#7C8DB0">▣ 镜像管理</text><text x="34" y="250" fill="#7C8DB0">▤ 数据卷管理</text>
    <rect x="12" y="266" width="176" height="34" rx="8" fill="#1D4ED8"/><text x="34" y="288" fill="#fff">◈ 网络管理</text>
    <text x="34" y="330" fill="#7C8DB0">◉ 通知中心</text><text x="34" y="370" fill="#7C8DB0">⚙ 设置中心</text>
  </g>
  <text x="232" y="46" fill="#E2E8F0" font-size="19" font-weight="700">网络管理 <tspan fill="#64748B" font-size="13">9 个网络</tspan></text>
  <rect x="1074" y="24" width="98" height="32" rx="9" fill="#1D4ED8"/><text x="1123" y="45" fill="#fff" font-size="13" text-anchor="middle">＋ 新建网络</text>
  <line x1="200" y1="64" x2="1200" y2="64" stroke="#1E2A4A"/>
  <rect x="228" y="86" width="380" height="34" rx="9" fill="#111C33" stroke="#1E2A4A"/>
  <text x="268" y="108" fill="#64748B" font-size="12">搜索网络名、驱动或容器…</text>
  <g font-size="12" fill="#64748B">
    <text x="244" y="156">网络名称</text><text x="480" y="156">驱动</text><text x="620" y="156">子网</text><text x="780" y="156">关联容器</text><text x="930" y="156">标签</text><text x="1120" y="156">操作</text>
  </g>
  <line x1="228" y1="168" x2="1172" y2="168" stroke="#1E2A4A"/>
  <g font-size="12">
    <g><text x="244" y="200" fill="#E2E8F0">bridge</text>
      <rect x="472" y="184" width="70" height="22" rx="6" fill="#1E3A5F"/><text x="507" y="199" fill="#7DD3FC" font-size="10" text-anchor="middle">bridge</text>
      <text x="620" y="200" fill="#94A3B8">172.17.0.0/16</text><text x="780" y="200" fill="#94A3B8">14 个容器</text>
      <text x="1120" y="200" fill="#F87171">删除</text></g>
    <line x1="228" y1="218" x2="1172" y2="218" stroke="#16203B"/>
    <g><text x="244" y="250" fill="#E2E8F0">host</text>
      <rect x="472" y="234" width="70" height="22" rx="6" fill="#301E5F"/><text x="507" y="249" fill="#D8B4FE" font-size="10" text-anchor="middle">host</text>
      <text x="620" y="250" fill="#94A3B8">共享主机网络</text><text x="780" y="250" fill="#94A3B8">2 个容器</text></g>
    <line x1="228" y1="268" x2="1172" y2="268" stroke="#16203B"/>
    <g><text x="244" y="300" fill="#E2E8F0">media_net</text>
      <rect x="472" y="284" width="86" height="22" rx="6" fill="#5F3A1E"/><text x="515" y="299" fill="#FDBA74" font-size="10" text-anchor="middle">macvlan</text>
      <text x="620" y="300" fill="#94A3B8">192.168.24.0/24</text><text x="780" y="300" fill="#94A3B8">4 个容器</text>
      <rect x="922" y="284" width="46" height="20" rx="10" fill="#1E3A5F"/><text x="945" y="298" fill="#7DD3FC" font-size="10" text-anchor="middle">影音</text>
      <text x="1120" y="300" fill="#F87171">删除</text></g>
    <line x1="228" y1="318" x2="1172" y2="318" stroke="#16203B"/>
    <g><text x="244" y="350" fill="#E2E8F0">none</text>
      <rect x="472" y="334" width="70" height="22" rx="6" fill="#16203B"/><text x="507" y="349" fill="#94A3B8" font-size="10" text-anchor="middle">null</text>
      <text x="620" y="350" fill="#94A3B8">无网络</text><text x="780" y="350" fill="#94A3B8">0 个容器</text></g>
  </g>
  <g>
    <rect x="228" y="392" width="944" height="336" rx="12" fill="#0E1830" stroke="#1E2A4A"/>
    <text x="252" y="424" fill="#94A3B8" font-size="12">▼ 新建网络（参数可选）</text>
    <g font-size="12">
      <rect x="252" y="446" width="280" height="38" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="270" y="470" fill="#64748B">名称：iot_net</text>
      <rect x="548" y="446" width="280" height="38" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="566" y="470" fill="#64748B">驱动：macvlan ▾</text>
      <rect x="844" y="446" width="304" height="38" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="862" y="470" fill="#64748B">子网：192.168.30.0/24</text>
      <rect x="252" y="498" width="280" height="38" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="270" y="522" fill="#64748B">网关：192.168.30.1</text>
      <rect x="548" y="498" width="280" height="38" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="566" y="522" fill="#64748B">标签（可选）…</text>
      <rect x="844" y="498" width="120" height="38" rx="9" fill="#1D4ED8"/><text x="904" y="522" fill="#fff" text-anchor="middle">创 建</text>
    </g>
    <g font-size="13" fill="#CBD5E1">
      <text x="252" y="580">· 驱动支持 bridge / host / macvlan / null，与容器、堆栈列表联动展示占用</text>
      <text x="252" y="608">· 网络可打彩色标签（与全局标签库共用）</text>
      <text x="252" y="636">· 被容器占用的网络删除前有保护提示</text>
    </g>
  </g>
</svg>
