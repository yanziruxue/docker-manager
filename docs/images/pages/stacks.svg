<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="760" fill="#0B1220"/>
  <rect width="200" height="760" fill="#0E1830"/>
  <rect x="24" y="22" width="26" height="26" rx="7" fill="#2563EB"/>
  <text x="60" y="40" fill="#E2E8F0" font-size="15" font-weight="600">Docker 管理</text>
  <g font-size="13">
    <text x="34" y="88" fill="#7C8DB0">◧ 仪表盘</text>
    <text x="34" y="130" fill="#7C8DB0">▤ 容器管理</text>
    <rect x="12" y="146" width="176" height="34" rx="8" fill="#1D4ED8"/>
    <text x="34" y="168" fill="#fff">⚗ 堆栈管理</text>
    <text x="34" y="210" fill="#7C8DB0">▣ 镜像管理</text>
    <text x="34" y="250" fill="#7C8DB0">▤ 数据卷管理</text>
    <text x="34" y="290" fill="#7C8DB0">◈ 网络管理</text>
    <text x="34" y="330" fill="#7C8DB0">◉ 通知中心</text>
    <text x="34" y="370" fill="#7C8DB0">⚙ 设置中心</text>
  </g>
  <text x="232" y="46" fill="#E2E8F0" font-size="19" font-weight="700">堆栈管理 <tspan fill="#64748B" font-size="13">34 个 · 17 运行中</tspan></text>
  <rect x="1074" y="24" width="98" height="32" rx="9" fill="#1D4ED8"/>
  <text x="1123" y="45" fill="#fff" font-size="13" text-anchor="middle">＋ 新建堆栈</text>
  <line x1="200" y1="64" x2="1200" y2="64" stroke="#1E2A4A"/>
  <!-- 堆栈行 -->
  <g font-size="12">
    <g>
      <rect x="228" y="88" width="944" height="64" rx="10" fill="#111C33" stroke="#1E2A4A"/>
      <circle cx="264" cy="120" r="15" fill="#0D9488"/>
      <text x="296" y="114" fill="#E2E8F0" font-size="14" font-weight="600">media</text>
      <rect x="296" y="124" width="46" height="18" rx="9" fill="#1E3A5F"/><text x="319" y="137" fill="#7DD3FC" font-size="10" text-anchor="middle">影音</text>
      <circle cx="560" cy="120" r="4" fill="#22C55E"/><text x="574" y="124" fill="#22C55E">运行中</text>
      <text x="690" y="124" fill="#94A3B8">容器 4/4</text>
      <text x="810" y="124" fill="#94A3B8">12 天</text>
      <circle cx="920" cy="120" r="5" fill="none" stroke="#22C55E" stroke-width="2"/><text x="934" y="124" fill="#64748B">已是最新</text>
      <g text-anchor="middle" font-size="11"><rect x="1030" y="104" width="52" height="30" rx="8" fill="#16203B"/><text x="1056" y="124" fill="#CBD5E1">编辑</text><rect x="1092" y="104" width="52" height="30" rx="8" fill="#16203B"/><text x="1118" y="124" fill="#F87171">停止</text></g>
    </g>
    <g>
      <rect x="228" y="164" width="944" height="64" rx="10" fill="#111C33" stroke="#1E2A4A"/>
      <circle cx="264" cy="196" r="15" fill="#D97706"/>
      <text x="296" y="190" fill="#E2E8F0" font-size="14" font-weight="600">download</text>
      <rect x="296" y="200" width="46" height="18" rx="9" fill="#5F3A1E"/><text x="319" y="213" fill="#FDBA74" font-size="10" text-anchor="middle">下载</text>
      <circle cx="560" cy="196" r="4" fill="#22C55E"/><text x="574" y="200" fill="#22C55E">运行中</text>
      <text x="690" y="200" fill="#94A3B8">容器 2/2</text>
      <text x="810" y="200" fill="#94A3B8">3 天</text>
      <circle cx="920" cy="196" r="5" fill="#F59E0B"/><text x="934" y="200" fill="#F59E0B">有可用更新</text>
      <g text-anchor="middle" font-size="11"><rect x="1030" y="180" width="52" height="30" rx="8" fill="#16203B"/><text x="1056" y="200" fill="#CBD5E1">编辑</text><rect x="1092" y="180" width="52" height="30" rx="8" fill="#16203B"/><text x="1118" y="200" fill="#F87171">停止</text></g>
    </g>
    <g opacity="0.55">
      <rect x="228" y="240" width="944" height="64" rx="10" fill="#111C33" stroke="#1E2A4A"/>
      <circle cx="264" cy="272" r="15" fill="#64748B"/>
      <text x="296" y="266" fill="#E2E8F0" font-size="14" font-weight="600">monitor</text>
      <circle cx="560" cy="272" r="4" fill="#64748B"/><text x="574" y="276" fill="#94A3B8">已停止</text>
      <text x="690" y="276" fill="#94A3B8">容器 0/3</text>
      <g text-anchor="middle" font-size="11"><rect x="1092" y="256" width="52" height="30" rx="8" fill="#16203B"/><text x="1118" y="276" fill="#4ADE80">启动</text></g>
    </g>
  </g>
  <!-- 编辑弹窗 -->
  <g>
    <rect x="300" y="330" width="700" height="400" rx="14" fill="#0E1830" stroke="#2563EB" stroke-width="1.5"/>
    <text x="332" y="366" fill="#E2E8F0" font-size="16" font-weight="700">编辑堆栈 · media</text>
    <circle cx="962" cy="360" r="10" fill="#16203B"/><text x="962" y="365" fill="#94A3B8" font-size="12" text-anchor="middle">✕</text>
    <!-- 页签 -->
    <g font-size="13" text-anchor="middle">
      <rect x="332" y="386" width="96" height="34" rx="9" fill="#1D4ED8"/><text x="380" y="408" fill="#fff">COMPOSE</text>
      <rect x="438" y="386" width="96" height="34" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="486" y="408" fill="#94A3B8">SETTINGS</text>
      <rect x="544" y="386" width="96" height="34" rx="9" fill="#111C33" stroke="#1E2A4A"/><text x="592" y="408" fill="#94A3B8">LABELS</text>
    </g>
    <!-- YAML 编辑区 -->
    <rect x="332" y="436" width="636" height="234" rx="10" fill="#0B1220" stroke="#1E2A4A"/>
    <g font-family="Consolas,monospace" font-size="12">
      <text x="350" y="466" fill="#7C8DB0">services:</text>
      <text x="366" y="488" fill="#7C8DB0">jellyfin:</text>
      <text x="382" y="510" fill="#8B7CF6">image<tspan fill="#CBD5E1">: jellyfin/jellyfin:latest</tspan></text>
      <text x="382" y="532" fill="#8B7CF6">restart<tspan fill="#CBD5E1">: unless-stopped</tspan></text>
      <text x="382" y="554" fill="#8B7CF6">ports<tspan fill="#CBD5E1">:</tspan></text>
      <text x="398" y="576" fill="#CBD5E1">- <tspan fill="#4ADE80">"8096:8096"</tspan></text>
      <text x="382" y="598" fill="#8B7CF6">volumes<tspan fill="#CBD5E1">:</tspan></text>
      <text x="398" y="620" fill="#CBD5E1">- <tspan fill="#4ADE80">/vol1/media:/media</tspan></text>
    </g>
    <text x="350" y="654" fill="#475569" font-size="11">YAML 高亮 · 在线编辑 / 上传 / 下载</text>
    <g text-anchor="middle" font-size="12">
      <rect x="768" y="690" width="88" height="30" rx="8" fill="#16203B"/><text x="812" y="710" fill="#CBD5E1">取消</text>
      <rect x="866" y="690" width="102" height="30" rx="8" fill="#1D4ED8"/><text x="917" y="710" fill="#fff">保存并重建</text>
    </g>
    <text x="332" y="712" fill="#475569" font-size="11">SETTINGS：名称/标签/图标｜LABELS：逐服务 WebUI</text>
  </g>
</svg>
